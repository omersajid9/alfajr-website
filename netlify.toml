# Netlify build configuration — read by Netlify when this repo is connected
# to your site. The site code lives in app/; Netlify builds there and
# publishes app/dist.

[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200